name: PHP Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '^1.22'

    - name: Install primitive
      run: |
        go install github.com/fogleman/primitive@latest
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, xml, ctype, iconv, gd
        tools: composer:v2
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Install Composer dependencies
      run: |
        if [ "${{ matrix.php-version }}" = "8.4" ]; then
          composer install --prefer-dist --no-progress --no-interaction
        else
          composer update --prefer-dist --no-progress --no-interaction
        fi
        ./bin/simple-phpunit install

    - name: Install NodeJS dependencies
      run: npm install

    - name: Code Review
      run: ./bin/rector process --config rector-ci.php --dry-run

    - name: Run test suite
      run: composer run test
